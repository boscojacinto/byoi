<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BYOI seat</title>
  <link rel="stylesheet" href="/seat/assets/seat.css" />
</head>
<body>
  <div class="shell">
    <p class="eyebrow">This table</p>
    <h1 id="name">Seat</h1>
    <p id="status" class="status">Looking for the desk…</p>
    <div class="cards">
      <a class="card" id="desk" href="http://127.0.0.1:8080/">
        <strong>Desk</strong>
        <span>Check people in</span>
      </a>
      <a class="card" id="guest" href="/guest/">
        <strong>Guest</strong>
        <span>Open the phone chat here</span>
      </a>
    </div>
  </div>
  <script src="/seat/assets/seat.js"></script>
</body>
</html>
