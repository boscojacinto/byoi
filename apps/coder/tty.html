<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Seat TTY</title>
  <link rel="stylesheet" href="/coder/assets/vendor/xterm.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #1b1612; }
    #term { height: 100%; padding: 6px; }
  </style>
</head>
<body>
  <div id="term"></div>
  <script src="/coder/assets/vendor/xterm.mjs"></script>
  <script src="/coder/assets/vendor/xterm-addon-fit.mjs"></script>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 13,
      theme: { background: "#1b1612", foreground: "#f4efe4" },
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("term"));
    fit.fit();
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const host = location.port === "8080" ? location.hostname + ":8787" : location.host;
    const ws = new WebSocket(proto + "://" + host + "/term");
    ws.binaryType = "arraybuffer";
    ws.onopen = () => {
      ws.send(JSON.stringify({ cols: term.cols, rows: term.rows }));
      term.focus();
    };
    ws.onmessage = (ev) => {
      if (ev.data instanceof ArrayBuffer) term.write(new Uint8Array(ev.data));
      else term.write(ev.data);
    };
    ws.onclose = () => term.writeln("\r\n[disconnected from seat tmux]");
    term.onData((data) => { if (ws.readyState === 1) ws.send(data); });
    window.addEventListener("resize", () => {
      fit.fit();
      if (ws.readyState === 1) ws.send(JSON.stringify({ cols: term.cols, rows: term.rows }));
    });
  </script>
</body>
</html>
